services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      GAMR_ARTIFACT_ROOT: /app/.gamr
      GAMR_TASK_ROOT: /app/tasks
    ports:
      - "6687:6687"
    volumes:
      - ./.gamr:/app/.gamr
      - ./tasks:/app/tasks:ro
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6687/healthz')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_ORIGIN: ${VITE_API_ORIGIN:-http://127.0.0.1:6687}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "6688:6688"
    restart: unless-stopped
