[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[project]
name = "gamr-api"
version = "0.1.0"
description = "GAMR FastAPI service"
requires-python = ">=3.14,<3.15"
dependencies = ["fastapi>=0.116,<1", "gamr-adapters", "gamr-engine", "uvicorn[standard]>=0.35,<1"]

[tool.uv.sources]
gamr-adapters = { workspace = true }
gamr-engine = { workspace = true }

[tool.uv.build-backend]
module-name = "gamr_api"
module-root = "src"
