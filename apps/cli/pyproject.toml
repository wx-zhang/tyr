[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[project]
name = "gamr-cli"
version = "0.1.0"
description = "GAMR command line interface"
requires-python = ">=3.14,<3.15"
dependencies = ["gamr-adapters", "gamr-engine", "rich>=14,<15", "typer>=0.16,<1"]

[project.scripts]
gamr = "gamr_cli.main:app"

[tool.uv.sources]
gamr-adapters = { workspace = true }
gamr-engine = { workspace = true }

[tool.uv.build-backend]
module-name = "gamr_cli"
module-root = "src"
