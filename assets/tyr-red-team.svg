<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Tyr Red Teaming Agent</title>
  <desc id="description">A Tyr-inspired arrow and ring transformed into an adversarial testing target, beside the words Tyr Red Teaming Agent.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080b"/>
      <stop offset="0.52" stop-color="#09131a"/>
      <stop offset="1" stop-color="#05080b"/>
    </linearGradient>
    <radialGradient id="blue-glow" cx="0" cy="0" r="1" gradientTransform="translate(224 181) rotate(10) scale(310 250)">
      <stop offset="0" stop-color="#37c9ff" stop-opacity="0.2"/>
      <stop offset="0.5" stop-color="#147aa6" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#071016" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="red-glow" cx="0" cy="0" r="1" gradientTransform="translate(1030 92) rotate(150) scale(250 150)">
      <stop offset="0" stop-color="#ff3f4b" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ff3f4b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="117" y1="90" x2="275" y2="268">
      <stop stop-color="#f7fbff"/>
      <stop offset="0.46" stop-color="#9be7ff"/>
      <stop offset="1" stop-color="#36b9ed"/>
    </linearGradient>
    <linearGradient id="scan" x1="132" y1="239" x2="281" y2="112">
      <stop stop-color="#ff2638" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff4350"/>
      <stop offset="1" stop-color="#ff7880" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#88dfff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="soft-blue" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="soft-red" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <clipPath id="panel-clip">
      <rect width="1200" height="360" rx="24"/>
    </clipPath>
  </defs>

  <g clip-path="url(#panel-clip)">
    <rect width="1200" height="360" fill="url(#background)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#blue-glow)"/>
    <rect width="1200" height="360" fill="url(#red-glow)"/>

    <path d="M0 294C118 256 192 316 306 276S500 258 614 286 812 318 930 269s189-27 270-7" fill="none" stroke="#66d8ff" stroke-opacity="0.08" stroke-width="2"/>
    <path d="M0 308C126 270 204 329 319 289s196-19 306 10 199 37 316-12 181-34 259-15" fill="none" stroke="#66d8ff" stroke-opacity="0.05"/>

    <g opacity="0.75">
      <path d="M356 54H388M372 38V70" stroke="#80dbff" stroke-opacity="0.45"/>
      <circle cx="372" cy="54" r="3" fill="#80dbff"/>
      <path d="M1094 275H1126M1110 259V291" stroke="#ff5360" stroke-opacity="0.45"/>
      <circle cx="1110" cy="275" r="3" fill="#ff5360"/>
    </g>

    <g aria-label="Tyr target emblem">
      <circle cx="198" cy="180" r="110" fill="#061018" stroke="#54cfff" stroke-opacity="0.16"/>
      <circle cx="198" cy="180" r="90" fill="none" stroke="#55d2ff" stroke-opacity="0.12" stroke-width="18" filter="url(#soft-blue)"/>
      <circle cx="198" cy="180" r="79" fill="none" stroke="url(#ring)" stroke-width="8"/>
      <circle cx="198" cy="180" r="61" fill="none" stroke="#9be7ff" stroke-opacity="0.13"/>

      <path d="M198 94V117M198 243V266M112 180H135M261 180H284" stroke="#a8eaff" stroke-opacity="0.52" stroke-width="2"/>
      <path d="M198 115L154 163L181 157V234C181 238 184 241 188 241H208C212 241 215 238 215 234V157L242 163L198 115Z" fill="#f7fbff"/>
      <path d="M198 115L154 163L181 157V174L198 170V115Z" fill="#c9f1ff"/>

      <path d="M121 240L275 111" stroke="#ff2638" stroke-opacity="0.2" stroke-width="15" filter="url(#soft-red)"/>
      <path d="M121 240L275 111" stroke="url(#scan)" stroke-width="3"/>
      <circle cx="250" cy="132" r="7" fill="#ff4753"/>
      <circle cx="250" cy="132" r="14" fill="none" stroke="#ff4753" stroke-opacity="0.38"/>
      <path d="M250 108V117M250 147V156M226 132H235M265 132H274" stroke="#ff6973" stroke-width="2"/>
    </g>

    <path d="M339 78V282" stroke="#6bd7ff" stroke-opacity="0.18"/>
    <path d="M339 118V183" stroke="#79dcff" stroke-opacity="0.8" stroke-width="2"/>
    <path d="M339 193V217" stroke="#ff4652" stroke-opacity="0.9" stroke-width="2"/>

    <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
      <text x="385" y="86" fill="#93dff9" font-size="16" font-weight="600" letter-spacing="5">TYR / ADVERSARIAL ASSURANCE</text>
      <text x="380" y="175" fill="#f7fbff" font-size="72" font-weight="700" letter-spacing="1">RED TEAMING</text>
      <text x="385" y="224" fill="#b8cbd4" font-size="25" font-weight="450" letter-spacing="8">AGENT</text>
      <text x="385" y="271" fill="#738a95" font-size="14" font-weight="500" letter-spacing="2.6">BREAK  ·  PROBE  ·  HARDEN</text>
    </g>

    <g transform="translate(1081 64)" fill="none" stroke-linecap="round">
      <path d="M0 0H56" stroke="#6bd7ff" stroke-opacity="0.18"/>
      <path d="M32 0H56" stroke="#ff4652" stroke-width="2"/>
      <circle cx="56" cy="0" r="3" fill="#ff4652" stroke="none"/>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="359" rx="23.5" fill="none" stroke="#91e3ff" stroke-opacity="0.14"/>
</svg>
