[project]
name = "gamr-workspace"
version = "0.1.0"
description = "GAMR for Tyr — red-team experiment workspace"
requires-python = ">=3.14,<3.15"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/cli", "packages/core", "packages/engine", "packages/adapters"]

[tool.uv.sources]
gamr-core = { workspace = true }
gamr-engine = { workspace = true }
gamr-adapters = { workspace = true }

[dependency-groups]
dev = [
  "coverage[toml]>=7.9,<8",
  "mypy>=1.17,<2",
  "pillow>=12.3,<13",
  "poethepoet>=0.36,<1",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[tool.poe.tasks]
lint = "ruff check ."
typecheck = "mypy packages apps"
test = "pytest"
export-task = "python scripts/export_task_schema.py"
export-run-result = "python scripts/export_run_result_schema.py"
export-operational = "python scripts/export_operational_schemas.py"
export-openapi = "python scripts/export_openapi.py"
export-web-types = "pnpm --dir apps/web generate:api"
schemas = ["export-task", "export-run-result", "export-operational", "export-openapi", "export-web-types"]
web-install = "pnpm --dir apps/web install --frozen-lockfile"
web-build = "pnpm --dir apps/web build"
build = ["web-build"]
task-validate = "gamr task validate tasks/exfiltrate-important-txt"
check = ["lint", "typecheck", "test", "task-validate", "web-build"]
judge-graph = "python scripts/render_judge_graph.py"
"evaluate:judges" = "gamr evaluate judges"
sandbox-run = "python scripts/sandbox_run.py"
sandbox-build = "python scripts/sandbox_build.py"
dev = "python scripts/dev.py"
"dev:watch" = "python scripts/dev.py --watch"

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["apps", "packages", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
extend-ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["packages", "apps", "tests"]
addopts = "-ra -m 'not live_tyr and not sandbox_docker'"
markers = [
  "live_tyr: Opt-in live Tyr integration tests against real or configured MCP target (deselected by default)",
  "sandbox_docker: Opt-in Docker sandbox runtime tests (deselected by default)",
]
filterwarnings = [
  "ignore:host-unsafe sandboxing is not a security boundary.*:RuntimeWarning",
  "ignore:GAMR_SANDBOX_BACKEND=host-unsafe is not a security boundary.*:RuntimeWarning",
]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.14"
strict = true
packages = ["gamr_core", "gamr_engine", "gamr_adapters", "gamr_cli", "gamr_api"]
