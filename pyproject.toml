[project]
name = "tyr-agent-tester"
version = "0.1.0"
description = "QA agent and CLI for testing Tyr Assistant"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "prompt-toolkit>=3.0",
    "python-dotenv>=1.0",
    "requests>=2.0",
    "rich>=13.0",
]

[project.scripts]
agent = "tyr_agent_tester.agent_loop:main"
cli = "tyr_agent_tester.cli_entry:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
