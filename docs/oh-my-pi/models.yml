providers:
  openrouter:
    apiKey: OPENROUTER_API_KEY
  abliteration:
    baseUrl: https://api.abliteration.ai/v1
    api: openai-completions
    apiKey: "PASTE_YOUR_ABLITERATION_API_KEY_HERE"
    authHeader: true
    models:
      - id: abliterated-model-large-v2
        name: Abliterated Model Large v2
        reasoning: true
        input: [text]
        contextWindow: 277000
        maxTokens: 999990
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high, xhigh, max]
          defaultLevel: high
        cost:
          input: 5
          output: 5
          cacheRead: 0.5
          cacheWrite: 0
  ollama:
    baseUrl: http://127.0.0.1:11434
    api: openai-responses
    auth: none
    discovery:
      type: ollama
    models:
      - id: qwen38-27b-uncensored:latest
        name: Qwen 27B Uncensored (Ollama)
        reasoning: true
        input: [text, image]
        contextWindow: 98304
        maxTokens: 32768
        cost:
          input: 0
          output: 0
          cacheRead: 0
          cacheWrite: 0
        thinking:
          mode: effort
          efforts: [minimal, low, medium, high, xhigh, max]
          defaultLevel: high
