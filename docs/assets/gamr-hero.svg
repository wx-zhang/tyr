      <circle r="157" fill="none" stroke="#65d8ff" stroke-opacity=".22" stroke-dasharray="2 12" stroke-linecap="round"/>
      <circle r="124" fill="none" stroke="#65d8ff" stroke-opacity=".16"/>
      <circle r="91" fill="#07171e" fill-opacity=".82" stroke="#77deff" stroke-opacity=".55"/>
      <path d="M0-157V-136M0 136V157M-157 0H-136M136 0H157" stroke="#7ddfff" stroke-width="2" opacity=".72"/>
      <path d="M-111-111-96-96M111-111 96-96M-111 111-96 96M111 111 96 96" stroke="#7ddfff" opacity=".45"/>

      <g fill="none" stroke="#5fd8ff" stroke-linejoin="round" filter="url(#soft-glow)">
        <path d="M0-52 48-29v42c0 34-20 57-48 72-28-15-48-38-48-72v-42Z" stroke-width="2" opacity=".9"/>
        <path d="M-26 20-7 39 31-5" stroke-width="3" stroke-linecap="round"/>
      </g>
      <circle r="5" fill="#b3aaff"/>

      <g fill="#68d9ff">
        <circle cx="-136" cy="-56" r="3"/><circle cx="-126" cy="91" r="3"/>
        <circle cx="91" cy="-126" r="3"/><circle cx="143" cy="52" r="3"/>
      </g>
      <g fill="none" stroke="#68d9ff" stroke-opacity=".36">
        <path d="M-136-56-76-31-35-63"/><path d="M-126 91-66 62-33 77"/>
        <path d="M91-126 55-73 72-42"/><path d="M143 52 81 30 66 57"/>
      </g>
    </g>

    <g fill="none" stroke-linecap="round">
      <path d="M1315 302c66-12 99-35 181-35" stroke="url(#mapped)"/>
      <path d="M1329 354c56 0 89 0 167 0" stroke="url(#mapped)"/>
      <path d="M1324 414c60 8 96 30 172 30" stroke="url(#mapped)"/>
    </g>
    <g font-family="Arial, Helvetica, sans-serif" font-size="11" letter-spacing="1.4" fill="#a6dff1" opacity=".78">
      <text x="1377" y="258">AUTH</text><text x="1408" y="345">POLICY</text><text x="1380" y="466">TRACE</text>
    </g>

    <g font-family="Arial, Helvetica, sans-serif">
      <g transform="translate(112 101)">
        <circle cx="15" cy="15" r="14" fill="none" stroke="#f5f8ff" stroke-width="1.5"/>
        <path d="M15 24V7m0 0-6 7m6-7 6 7" fill="none" stroke="#f5f8ff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
        <text x="42" y="20" font-size="16" font-weight="700" letter-spacing="3.4" fill="#f5f8ff">FOR TYR · tyr.ai</text>
      </g>

      <text x="108" y="227" font-size="24" letter-spacing="5.5" fill="#a9a0ff">GENERATIVE ADVERSARIAL</text>
      <text x="101" y="354" font-size="152" font-weight="300" letter-spacing="-7" fill="url(#title-gradient)">GAMR</text>
      <text x="110" y="407" font-size="30" font-weight="400" letter-spacing="-.4" fill="#f2f6f8">Tyr's final opponent</text>
      <text x="110" y="455" font-size="17" letter-spacing=".25" fill="#a6bac3">A red-teaming agent that probes Tyr’s security boundary</text>
      <text x="110" y="481" font-size="17" letter-spacing=".25" fill="#a6bac3">between AI agents, tools, and the systems they can reach.</text>

      <g transform="translate(110 564)" font-size="12" letter-spacing="1.45">
        <rect width="114" height="32" rx="16" fill="#a9a0ff" fill-opacity=".1" stroke="#a9a0ff" stroke-opacity=".42"/>
        <circle cx="18" cy="16" r="3" fill="#afa7ff"/>
        <text x="30" y="20" fill="#d5d1ff">ADVERSARIAL</text>
        <rect x="126" width="104" height="32" rx="16" fill="#59d6ff" fill-opacity=".08" stroke="#59d6ff" stroke-opacity=".36"/>
        <circle cx="144" cy="16" r="3" fill="#59d6ff"/>
        <text x="156" y="20" fill="#bcecff">READ-ONLY</text>
        <rect x="242" width="112" height="32" rx="16" fill="#59d6ff" fill-opacity=".08" stroke="#59d6ff" stroke-opacity=".36"/>
        <circle cx="260" cy="16" r="3" fill="#59d6ff"/>
        <text x="272" y="20" fill="#bcecff">EVIDENCE</text>
