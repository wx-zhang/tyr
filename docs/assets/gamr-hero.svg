<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="720" viewBox="0 0 1600 720" role="img" aria-labelledby="title description">
  <title id="title">GAMR for Tyr — Generative Adversarial Risk Mapper</title>
  <desc id="description">Adversarial signals flow through a luminous risk-mapping field into a governed Tyr boundary.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020507"/>
      <stop offset="0.58" stop-color="#07131a"/>
      <stop offset="1" stop-color="#071e27"/>
    </linearGradient>
    <radialGradient id="cyan-haze" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#51d4ff" stop-opacity=".18"/>
      <stop offset=".46" stop-color="#2786b8" stop-opacity=".08"/>
      <stop offset="1" stop-color="#061016" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet-haze" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#a9a0ff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#a9a0ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8f88ed" stop-opacity="0"/>
      <stop offset=".34" stop-color="#a9a0ff"/>
      <stop offset="1" stop-color="#58d6ff"/>
    </linearGradient>
    <linearGradient id="mapped" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58d6ff"/>
      <stop offset="1" stop-color="#58d6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title-gradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".54" stop-color="#e2e7ff"/>
      <stop offset="1" stop-color="#9995ee"/>
    </linearGradient>
    <pattern id="micro-grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#79cfff" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="line-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame-clip">
      <rect x="28" y="28" width="1544" height="664" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#frame-clip)">
    <rect x="28" y="28" width="1544" height="664" rx="22" fill="url(#background)"/>
    <rect x="28" y="28" width="1544" height="664" rx="22" fill="url(#micro-grid)"/>
    <ellipse cx="1172" cy="358" rx="470" ry="404" fill="url(#cyan-haze)"/>
    <ellipse cx="445" cy="172" rx="360" ry="310" fill="url(#violet-haze)"/>

    <g fill="#b7ecff" opacity=".55">
      <circle cx="110" cy="96" r="1.2"/><circle cx="212" cy="620" r="1"/><circle cx="349" cy="75" r="1.4"/>
      <circle cx="604" cy="652" r="1.1"/><circle cx="767" cy="104" r=".9"/><circle cx="920" cy="612" r="1.4"/>
      <circle cx="1048" cy="78" r="1.1"/><circle cx="1327" cy="112" r="1.3"/><circle cx="1498" cy="576" r="1"/>
