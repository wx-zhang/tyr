      <path d="M718 692 1036 391"/><path d="M882 692 1082 400"/><path d="M1044 692 1122 406"/>
      <path d="M1206 692 1165 407"/><path d="M1368 692 1208 400"/><path d="M1530 692 1255 389"/>
      <path d="M768 645H1458"/><path d="M824 594H1408"/><path d="M879 546H1359"/><path d="M931 501H1311"/>
      <path d="M980 460H1267"/><path d="M1028 424H1225"/>
    </g>

    <g fill="none" stroke-linecap="round">
      <path d="M650 272C748 272 764 318 853 318S943 347 1006 347" stroke="url(#signal)" stroke-width="1.5"/>
      <path d="M650 326C733 326 772 359 847 359S934 369 1002 369" stroke="url(#signal)" stroke-width="1.2"/>
      <path d="M650 391C753 391 769 410 850 410S936 391 1005 391" stroke="url(#signal)" stroke-width="1.5"/>
      <path d="M650 449C746 449 766 437 850 437S929 413 1014 413" stroke="url(#signal)" stroke-width="1.1"/>
    </g>
