openapi: 3.1.0
info:
  title: GAMR Run Evidence API Design Contract
  version: 0.1.0
paths:
  /api/v1/runs/{run_id}/visualization:
    get:
      summary: Get one run's progress and evidence overview
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Permitted redacted run overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RunVisualization' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/runs/{run_id}/activity:
    get:
      summary: Search and page one run's permitted redacted activity
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/ParticipantId'
        - $ref: '#/components/parameters/ActivityType'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/EvidenceType'
        - $ref: '#/components/parameters/OccurredFrom'
        - $ref: '#/components/parameters/OccurredTo'
        - $ref: '#/components/parameters/RelationshipId'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Stable cursor page in authoritative sequence order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runs/{run_id}/relationships:
    get:
      summary: Aggregate observed relationships under the same evidence filters
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/CaseId'
        - $ref: '#/components/parameters/ParticipantId'
        - $ref: '#/components/parameters/ActivityType'
        - $ref: '#/components/parameters/Status'
        - $ref: '#/components/parameters/EvidenceType'
        - $ref: '#/components/parameters/OccurredFrom'
        - $ref: '#/components/parameters/OccurredTo'
      responses:
        '200':
          description: Filtered participants and relationship aggregates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RelationshipProjection' }
        '400': { $ref: '#/components/responses/InvalidQuery' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runs/{run_id}/evidence/{evidence_id}:
    get:
      summary: Get permitted evidence metadata and summary
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Summary-first evidence metadata
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /api/v1/runs/{run_id}/evidence/{evidence_id}/content:
    get:
      summary: Deliberately reveal complete permitted redacted evidence content
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Defense-in-depth redacted content or explicit availability state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceContent' }
        '404': { $ref: '#/components/responses/NotFound' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '413': { description: Permitted evidence exceeds the interactive detail limit }
  /api/v1/runs/{run_id}/evidence/{evidence_id}/download:
    get:
      summary: Download oversized permitted redacted evidence without exposing a server path
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Redacted evidence attachment with a safe generated filename
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runs/{run_id}/collector-verifications:
    get:
      summary: List safe remote-backed collector metadata for one run
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Collector verification and file metadata without credentials or bytes
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runs/{run_id}/collector-files/{file_id}/preview:
    get:
      summary: Preview one bounded supported collector file after remote verification
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Inline text or raster-image preview with no-store and nosniff headers
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Verified collector file exceeds the preview limit }
        '415': { description: Verified collector file type is not previewable }
  /api/v1/runs/{run_id}/collector-files/{file_id}/download:
    get:
      summary: Download one run-confined collector file after remote verification
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/FileId'
      responses:
        '200':
          description: Original verified collector file as an attachment
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runs/{run_id}/events:
    get:
      summary: Stream bounded run activity notifications with resumable sequence IDs
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: Last-Event-ID
          in: header
          required: false
          schema: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Long-lived run-activity SSE notifications and heartbeat comments
          content:
            text/event-stream:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  parameters:
    RunId:
      name: run_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    EvidenceId:
      name: evidence_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    FileId:
      name: file_id
      in: path
      required: true
      schema: { type: string, minLength: 1 }
    Search:
      name: q
      in: query
      schema: { type: string, minLength: 1, maxLength: 200 }
    CaseId:
      name: caseId
      in: query
      schema: { type: string }
    ParticipantId:
      name: participantId
      in: query
      schema: { type: string }
    ActivityType:
      name: activityType
      in: query
      schema: { $ref: '#/components/schemas/ActivityType' }
    Status:
      name: status
      in: query
      schema: { type: string }
    EvidenceType:
      name: evidenceType
      in: query
      schema: { $ref: '#/components/schemas/EvidenceType' }
    OccurredFrom:
      name: occurredFrom
      in: query
      schema: { type: string, format: date-time }
    OccurredTo:
      name: occurredTo
      in: query
      schema: { type: string, format: date-time }
    RelationshipId:
      name: relationshipId
      in: query
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 100 }
  schemas:
    ActivityType:
      type: string
      enum: [run_state, phase, case, communication, tyr_operation, execution, delegation, bridge, tool_call, approval, finding, artifact, error, system]
    EvidenceType:
      type: string
      enum: [event, transcript, diagnostic, approval, finding, artifact, error]
    Availability:
      type: string
      enum: [available, redacted, omitted, missing, malformed]
    RunVisualization:
      type: object
      required: [run, phases, cases, attention, counts, latestSequence]
      properties:
        run:
          type: object
          required: [id, state, actionMode, dataset, startedAt, latestUpdateAt]
          properties:
            id: { type: string }
            state: { type: string }
            actionMode: { type: string, enum: [read_only, approval_required] }
            dataset: { type: string }
            startedAt: { type: string, format: date-time }
            latestUpdateAt: { type: string, format: date-time }
            finishedAt: { type: [string, 'null'], format: date-time }
            outcome: { type: [string, 'null'] }
        phases:
          type: array
          items: { $ref: '#/components/schemas/ProgressItem' }
        cases:
          type: array
          items: { $ref: '#/components/schemas/CaseProgress' }
        attention:
          type: object
          required: [pendingApprovalCount, blockers, unsettledTyrWork]
          properties:
            pendingApprovalCount: { type: integer, minimum: 0 }
            blockers: { type: array, items: { type: string } }
            unsettledTyrWork: { type: boolean }
        counts:
          type: object
          required: [totalKnown, completedCases]
          properties:
            totalKnown: { type: boolean }
            totalCases: { type: [integer, 'null'], minimum: 0 }
            completedCases: { type: integer, minimum: 0 }
        latestSequence: { type: integer, minimum: 0 }
    ProgressItem:
      type: object
      required: [id, label, state]
      properties:
        id: { type: string }
        label: { type: string }
        state: { type: string }
        latestSequence: { type: [integer, 'null'], minimum: 1 }
    CaseProgress:
      type: object
      required: [caseId, order, state]
      properties:
        caseId: { type: string }
        order: { type: integer, minimum: 0 }
        state: { type: string }
        verdict: { type: [string, 'null'] }
        objectiveStatus: { type: [string, 'null'] }
        outcome: { type: [string, 'null'] }
        summary: { type: [string, 'null'] }
        latestSequence: { type: [integer, 'null'], minimum: 1 }
    ActivityItem:
      type: object
      required: [id, sequence, occurredAt, activityType, status, evidenceType, summary, evidenceIds, detailAvailability]
      properties:
        id: { type: string }
        sequence: { type: integer, minimum: 1 }
        occurredAt: { type: string, format: date-time }
        activityType: { $ref: '#/components/schemas/ActivityType' }
        status: { type: string }
        phase: { type: [string, 'null'] }
        caseId: { type: [string, 'null'] }
        turnId: { type: [string, 'null'] }
        operationId: { type: [string, 'null'] }
        approvalId: { type: [string, 'null'] }
        sourceParticipantId: { type: [string, 'null'] }
        targetParticipantId: { type: [string, 'null'] }
        evidenceType: { $ref: '#/components/schemas/EvidenceType' }
        summary: { type: string }
        evidenceIds: { type: array, items: { type: string } }
        detailAvailability: { $ref: '#/components/schemas/Availability' }
    ActivityPage:
      type: object
      required: [items, nextCursor, omittedBefore, omittedAfter, latestSequence]
      properties:
        items:
          type: array
          maxItems: 200
          items: { $ref: '#/components/schemas/ActivityItem' }
        nextCursor: { type: [string, 'null'] }
        omittedBefore: { type: integer, minimum: 0 }
        omittedAfter: { type: integer, minimum: 0 }
        latestSequence: { type: integer, minimum: 0 }
    Participant:
      type: object
      required: [id, kind, displayLabel, firstObservedSequence]
      properties:
        id: { type: string }
        kind: { type: string, enum: [human, gamr, model_agent, tyr_agent, delegated_agent, bridge, tool, unknown] }
        displayLabel: { type: string }
        firstObservedSequence: { type: integer, minimum: 1 }
    Relationship:
      type: object
      required: [id, sourceParticipantId, targetParticipantId, relationshipTypes, activityCount, statusCounts, firstSequence, lastSequence]
      properties:
        id: { type: string }
        sourceParticipantId: { type: string }
        targetParticipantId: { type: string }
        relationshipTypes: { type: array, items: { type: string } }
        activityCount: { type: integer, minimum: 1 }
        statusCounts: { type: object, additionalProperties: { type: integer, minimum: 0 } }
        firstSequence: { type: integer, minimum: 1 }
        lastSequence: { type: integer, minimum: 1 }
    RelationshipProjection:
      type: object
      required: [participants, relationships]
      properties:
        participants: { type: array, items: { $ref: '#/components/schemas/Participant' } }
        relationships: { type: array, items: { $ref: '#/components/schemas/Relationship' } }
    EvidenceSummary:
      type: object
      required: [id, evidenceType, summary, availability, downloadAvailable, provenance]
      properties:
        id: { type: string }
        evidenceType: { $ref: '#/components/schemas/EvidenceType' }
        summary: { type: string }
        availability: { $ref: '#/components/schemas/Availability' }
        contentSize: { type: [integer, 'null'], minimum: 0 }
        downloadAvailable: { type: boolean }
        provenance: { type: object, additionalProperties: true }
    EvidenceContent:
      type: object
      required: [id, availability, redacted, content]
      properties:
        id: { type: string }
        availability: { $ref: '#/components/schemas/Availability' }
        redacted: { type: boolean, const: true }
        content: {}
    Problem:
      type: object
      required: [code, detail]
      properties:
        code: { type: string }
        detail: { type: string }
  responses:
    Forbidden:
      description: The authenticated actor cannot view this run or evidence
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidQuery:
      description: Invalid, stale, malformed, or cross-run filter or cursor
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Run or permitted evidence not found
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
