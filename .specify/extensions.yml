installed:
- parallel-implement
settings:
  auto_execute_hooks: true
hooks:
  after_tasks:
  - extension: parallel-implement
    command: speckit.parallel-implement.run
    enabled: true
    optional: true
    priority: 10
    prompt: Start parallel implementation? User stories run in worktrees concurrently,
      then merge sequentially.
    description: Offer parallel implementation after tasks are generated
    condition: null
