[build-system]
requires = ["uv_build>=0.8.0,<0.9"]
build-backend = "uv_build"

[project]
name = "gamr-adapters"
version = "0.1.0"
description = "GAMR external integrations and persistence adapters"
requires-python = ">=3.14,<3.15"
dependencies = [
  "gamr-core",
  "gamr-engine",
  "httpx>=0.28,<1",
  "openai>=1.99,<2",
  "pydantic-settings>=2.10,<3",
]

[tool.uv.sources]
gamr-core = { workspace = true }
gamr-engine = { workspace = true }

[tool.uv.build-backend]
module-name = "gamr_adapters"
module-root = "src"
