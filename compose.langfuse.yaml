services:
  langfuse-server:
    image: langfuse/langfuse:2.60.0
    depends_on:
      langfuse-postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-postgres:5432/langfuse
      NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:-gamr-langfuse-secret-key-32-chars-minimum-ok}
      SALT: ${LANGFUSE_SALT:-gamr-langfuse-salt-key-32-chars-minimum-ok}
      NEXTAUTH_URL: http://127.0.0.1:${GAMR_DOCKER_LANGFUSE_PORT:-${DOCKER_LANGFUSE_PORT:-3000}}
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "true"
    ports:
      - "127.0.0.1:${GAMR_DOCKER_LANGFUSE_PORT:-${DOCKER_LANGFUSE_PORT:-3000}}:3000"
    restart: unless-stopped

  langfuse-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  langfuse-postgres-data:
